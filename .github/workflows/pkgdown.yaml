name: pkgdown

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# Le site rend un article dont le code s'EXÉCUTE, donc cette construction
# a besoin du même Python que la suite de tests : interpréteur, numpy,
# pandas, scipy, puis card et stase à leurs tags. C'est la raison pour
# laquelle l'article vit dans `vignettes/articles/` et non dans
# `vignettes/` : là, `R CMD build` l'ignore, si bien qu'installer le
# paquet ne provisionne rien et que seul ce workflow paie ce coût.

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # Même clé que la CI de tests : `R/zzz.R` porte `CARD_REF` et
      # `STASE_REF`, donc monter une ref reconstruit le site sur le bon
      # corpus au lieu de servir l'ancien depuis le cache.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/R/reticulate
          key: reticulate-${{ runner.os }}-${{ hashFiles('R/zzz.R') }}

      - name: Construire le site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # pkgdown rend TOUT `*.md` de la racine en page du site, et n'offre
      # aucun moyen de l'en empêcher (`package_mds()` globe, sa liste
      # d'exceptions est en dur). `CLAUDE.md` est des instructions de
      # travail, pas de la documentation : il est déjà lisible sur
      # GitHub, il n'a rien à faire dans la navigation ni dans l'index de
      # recherche du site.
      - name: Retirer les pages que pkgdown ramasse sans qu'on lui demande
        run: rm -f docs/CLAUDE.html

      - name: Publier sur gh-pages
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          clean: false
          branch: gh-pages
          folder: docs
